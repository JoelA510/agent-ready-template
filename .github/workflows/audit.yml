name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published against code that has already merged. Without a schedule, a repo
  # with no open PRs never finds out. Mondays, 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Nothing by default; each job asks for what it uses, so a job added later starts with nothing.
permissions: {}

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# Each job's `name` is a required check in .github/rulesets/main.json. Renaming or adding a job
# means updating that file (a test holds them equal) and re-importing it in Settings → Rules.
jobs:
  audit:
    name: npm audit (high and critical block)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # only used by the scheduled-failure step below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # nothing restored from a cache into a job whose token can write

      - name: Use the pinned npm
        run: v=$(node -p "require('./package.json').packageManager.split('@')[1]") && npx -y "npm@$v" install -g "npm@$v" # zizmor: ignore[adhoc-packages] -- the exact npm package.json pins

      # `npm audit` reads package-lock.json; no install needed. Policy and waivers:
      # docs/security/dependency-policy.md.
      - name: Audit dependencies
        run: npm run check:audit

      # A red scheduled run notifies only whoever last edited the cron line, so on a schedule a
      # failure also opens (once) an issue the whole repo can see.
      - name: Open an issue when the scheduled audit fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dependency audit is failing on main"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The scheduled \`npm run check:audit\` run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix or waive per docs/security/dependency-policy.md, then close this issue."
          fi
