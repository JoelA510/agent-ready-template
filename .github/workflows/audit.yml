name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published against code that has already merged. Without a schedule, a repo
  # with no open PRs never finds out. Mondays, 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Nothing by default; each job asks for what it uses, so a job added later starts with nothing.
permissions: {}

# A newer run supersedes an older one of the same event on the same ref. The event is in the
# group so a push to main and the weekly schedule, both on main, never cancel each other: a
# cancelled scheduled run opens no issue, and a cancelled push run leaves main's check unreported.
concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The `name` of each job a pull request runs is a required check in .github/rulesets/main.json.
# Renaming or adding one means updating that file (a test holds them equal) and re-importing it in
# Settings → Rules.
jobs:
  audit:
    name: npm audit (high and critical block)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # nothing restored from a cache into a job whose token can write

      - name: Use the pinned npm
        run: v=$(node -p "require('./package.json').packageManager.split('@')[1]") && npx -y "npm@$v" install -g "npm@$v" # zizmor: ignore[adhoc-packages] -- the exact npm package.json pins

      # `npm audit` reads package-lock.json; no install needed. Policy and waivers:
      # docs/security/dependency-policy.md.
      - name: Audit dependencies
        run: npm run check:audit

  # A red scheduled run notifies only whoever last edited the cron line, so on a schedule a
  # failure also opens (once) an issue the whole repo can see. Its own job, so the token that can
  # write issues never shares a runner with the checkout and the npm it runs. It only runs on the
  # schedule, so a pull request reports it skipped, and the ruleset doesn't require it.
  report-scheduled-failure:
    name: Open an issue when the scheduled audit fails
    needs: audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue, unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dependency audit is failing on main"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The scheduled dependency audit (check:audit) failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix or waive per docs/security/dependency-policy.md, then close this issue."
          fi
