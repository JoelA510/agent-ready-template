name: Copilot setup steps

# The Copilot cloud agent's environment: GitHub runs this job, which must be named
# copilot-setup-steps, before the agent starts, and only from the default branch. The agent then
# has the pinned Node and npm and the installed dependencies, so the guard hook in
# .github/hooks/guard-generated.json and `npm run check` can run. Node comes from setup-node, as in
# CI, so this installs the way CI does rather than through scripts/setup.sh. The triggers below
# only check the file when it changes; not on pull requests, where a check that runs only for
# some changes can't be required.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]

# Nothing by default; each job asks for what it uses, so a job added later starts with nothing.
permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # the agent works here with push access: nothing restored from a cache

      - name: Use the pinned npm
        run: v=$(node -p "require('./package.json').packageManager.split('@')[1]") && npx -y "npm@$v" install -g "npm@$v" # zizmor: ignore[adhoc-packages] -- the exact npm package.json pins

      - name: Install dependencies
        run: npm ci
